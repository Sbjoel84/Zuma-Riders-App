<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver on the way</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#12161b}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #e6e9e2; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; color: #12161b">

  <svg width="390" height="420" viewBox="0 0 390 420" aria-hidden="true" style="position: absolute; top: 0; left: 0; display: block">
    <rect width="390" height="420" fill="#e6e9e2"></rect>
    <path d="M-10 120 L400 170" stroke="#ffffff" stroke-width="16"></path>
    <path d="M70 -10 L120 430" stroke="#ffffff" stroke-width="12"></path>
    <path d="M-10 300 L400 260" stroke="#ffffff" stroke-width="12"></path>
    <path d="M280 -10 L310 430" stroke="#ffffff" stroke-width="10"></path>
    <rect x="160" y="190" width="80" height="50" rx="6" fill="#d3e2cf"></rect>
    <path d="M290 90 L296 160 L110 140 L118 230" stroke="#12161b" stroke-width="4" fill="none" stroke-linejoin="round"></path>
    <circle cx="118" cy="232" r="11" fill="#12161b"></circle>
    <circle cx="118" cy="232" r="5" fill="#ffffff"></circle>
    <g transform="translate(290 90) rotate(95)">
      <rect x="-9" y="-6" width="18" height="12" rx="3" fill="#f2a900" stroke="#12161b" stroke-width="2.5"></rect>
    </g>
  </svg>

  <div style="position: absolute; top: 56px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center">
    <a href="Offers.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(18,22,27,0.12)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12161b" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="padding: 10px 16px; border-radius: 22px; background: #12161b; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #f2a900" aria-hidden="true"></span>
      Ibrahim is 4 min away
    </div>
    <button aria-label="Emergency SOS" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #b3261e; color: #ffffff; font: 700 12px Figtree, sans-serif; box-shadow: 0 2px 8px rgba(18,22,27,0.2)">SOS</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 470px; box-sizing: border-box; background: #ffffff; border-radius: 24px 24px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -4px 24px rgba(18,22,27,0.08)">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #d6d9d2; align-self: center"></div>

    <div style="display: flex; gap: 14px; align-items: center">
      <div style="width: 56px; height: 56px; border-radius: 28px; background: #e6e9e2; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px" aria-hidden="true">IB</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-weight: 700; font-size: 17px">Ibrahim</div>
        <div style="font-size: 13px; color: #5d645c">★ 4.92 · 1,248 trips · since 2023</div>
      </div>
      <div style="text-align: right">
        <div style="display: inline-block; padding: 4px 8px; border: 2px solid #12161b; border-radius: 6px; font-family: 'Familjen Grotesk', Figtree, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.06em">BWR 482 KD</div>
        <div style="font-size: 12px; color: #5d645c; margin-top: 4px">Silver Toyota Corolla</div>
      </div>
    </div>

    <div style="background: #fff6dd; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
      <div>
        <div style="font-size: 13px; font-weight: 600">Trip PIN</div>
        <div style="font-size: 12px; color: #5d645c">Tell the driver at pickup</div>
      </div>
      <div style="display: flex; gap: 6px" aria-label="PIN 4 7 1 9">
        <sc-for list="{{pin}}" as="d" hint-placeholder-count="4">
          <span style="width: 34px; height: 42px; border-radius: 8px; background: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Familjen Grotesk', Figtree, sans-serif; font-size: 22px; font-weight: 700">{{d}}</span>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="height: 64px; border-radius: 14px; border: 1px solid #e1e4dd; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 13px Figtree, sans-serif; color: #12161b">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12161b" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
        Message
      </button>
      <button style="height: 64px; border-radius: 14px; border: 1px solid #e1e4dd; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 13px Figtree, sans-serif; color: #12161b">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12161b" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
        Call
      </button>
      <button style="height: 64px; border-radius: 14px; border: 1px solid #e1e4dd; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 13px Figtree, sans-serif; color: #12161b">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12161b" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"></path></svg>
        Share trip
      </button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px; border-top: 1px solid #eceee9; font-size: 14px">
      <div style="display: flex; gap: 8px; align-items: center; padding-top: 12px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5d645c" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span style="color: #5d645c">Agreed fare · Cash</span>
      </div>
      <span style="padding-top: 12px; font-family: 'Familjen Grotesk', Figtree, sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">₦6,500</span>
    </div>

    <a href="Main.dc.html" style="margin-top: auto; text-align: center; font-size: 14px; color: #b3261e; padding: 10px; font-weight: 600">Cancel ride</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { pin: ['4', '7', '1', '9'] };
  }
}
</script>
</body>
</html>
