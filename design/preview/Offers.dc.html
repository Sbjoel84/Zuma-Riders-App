<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare driver offers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#12161b}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f5f1; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; color: #12161b; padding: 60px 16px 24px; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back to route" style="width: 44px; height: 44px; border-radius: 22px; background: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12161b" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="text-align: center">
      <div style="font-family: 'Familjen Grotesk', Figtree, sans-serif; font-size: 20px; font-weight: 700">{{count}} drivers responded</div>
      <div style="font-size: 12px; color: #5d645c">Request open for 2:14 more</div>
    </div>
    <div style="width: 44px"></div>
  </div>

  <div style="height: 4px; border-radius: 2px; background: #e1e4dd; overflow: hidden">
    <div style="width: 62%; height: 4px; background: #f2a900"></div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; background: #ffffff; border-radius: 14px; padding: 12px 14px; font-size: 13px">
    <div>
      <div style="color: #5d645c">Your offer · Economy · Cash</div>
      <div style="font-weight: 600">Wuse 2 → Airport · 38.2 km</div>
    </div>
    <div style="font-family: 'Familjen Grotesk', Figtree, sans-serif; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">₦6,500</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0">
    <sc-for list="{{offers}}" as="o" hint-placeholder-count="3">
      <div style="background: #ffffff; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #e6e8e3">
        <div style="display: flex; gap: 12px; align-items: center">
          <div style="width: 48px; height: 48px; border-radius: 24px; background: #e6e9e2; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px" aria-hidden="true">{{o.initials}}</div>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; gap: 6px; align-items: center">
              <span style="font-weight: 700; font-size: 15px">{{o.name}}</span>
              <span style="font-size: 13px; color: #5d645c">★ {{o.rating}} · {{o.trips}} trips</span>
            </div>
            <div style="font-size: 13px; color: #5d645c">{{o.car}} · {{o.eta}}</div>
          </div>
          <div style="text-align: right">
            <div style="font-family: 'Familjen Grotesk', Figtree, sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">{{o.price}}</div>
            <sc-if value="{{o.yours}}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 11px; font-weight: 600; color: #1f7a4f">Your price</div>
            </sc-if>
            <sc-if value="{{o.counter}}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 11px; font-weight: 600; color: #9a5b00">{{o.diff}}</div>
            </sc-if>
          </div>
        </div>
        <div style="display: flex; gap: 8px">
          <button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #e1e4dd; background: #ffffff; font: 600 14px Figtree, sans-serif; color: #12161b">Decline</button>
          <a href="Trip.dc.html" style="flex: 2; height: 44px; border-radius: 12px; background: #12161b; color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 14px">Accept {{o.price}}</a>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <button style="height: 48px; border-radius: 14px; border: 1px solid #12161b; background: transparent; font: 600 15px Figtree, sans-serif; color: #12161b">Raise my offer to ₦7,000</button>
    <a href="Main.dc.html" style="text-align: center; font-size: 14px; color: #5d645c; padding: 10px">Cancel request</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var offers = [
      { initials: 'IB', name: 'Ibrahim', rating: '4.92', trips: '1,248', car: 'Toyota Corolla, silver', eta: '4 min away', price: '₦6,500', yours: true, counter: false, diff: '' },
      { initials: 'CO', name: 'Chinedu', rating: '4.88', trips: '806', car: 'Honda Accord, black', eta: '3 min away', price: '₦7,000', yours: false, counter: true, diff: '+₦500' },
      { initials: 'MU', name: 'Musa', rating: '4.97', trips: '2,031', car: 'Toyota Camry, grey', eta: '6 min away', price: '₦7,500', yours: false, counter: true, diff: '+₦1,000' }
    ];
    return { offers: offers, count: offers.length };
  }
}
</script>
</body>
</html>
