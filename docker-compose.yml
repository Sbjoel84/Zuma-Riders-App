# Local Postgres (with PostGIS) and Redis for development.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: zuma, POSTGRES_PASSWORD: zuma, POSTGRES_DB: zuma_dev }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro"]
  redis:
    image: redis:7
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports: ["6379:6379"]
volumes:
  pgdata:
